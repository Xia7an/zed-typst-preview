[package]
name = "typst-livepreview"
version = "0.1.0"
edition = "2024"
description = "Native (non-web) live preview server for Typst, designed for the Zed editor"
license = "Apache-2.0"

[workspace]

[[bin]]
name = "typst-livepreview"
path = "src/main.rs"

[dependencies]
typst = "0.15.1"
typst-render = "0.15.1"
typst-ide = "0.15.1"
typst-layout = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "system-files", "system-downloader", "datetime"] }
ecow = "0.2"
tiny-skia = "0.11"
lsp-server = "0.7"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"
softbuffer = "0.4"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = true

[profile.dev.package."*"]
opt-level = 2
