[package]
name = "tex-livepreview"
version = "0.1.0"
edition = "2024"
description = "Native (non-web) live preview server for LaTeX, designed for the (patched) Zed editor"
license = "Apache-2.0"

[workspace]

[[bin]]
name = "tex-livepreview"
path = "src/main.rs"

[dependencies]
hayro = "0.7.1"
lsp-server = "0.7"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
flate2 = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
url = "2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = true

[profile.dev.package."*"]
opt-level = 2
